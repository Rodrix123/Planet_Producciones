<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Planet Producciones</title>

    <link rel="icon" type="image/png" href="logo.png?v=2">
    <link rel="shortcut icon" type="image/png" href="logo.png?v=2">
    <link rel="apple-touch-icon" href="logo.png?v=2">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="sitio-body" data-pagina="acceso">

    <div id="sitio-header"></div>

    <main class="acceso">
        <div class="contenedor acceso-grid">
            <div class="acceso-arco" aria-hidden="true">
                <div>
                    <img src="galeria/web/evento-sin-pantalla-9.webp" width="1200" height="1353" alt="">
                </div>
            </div>

            <div class="login-card">
                <div class="login-card-header">
                    <img src="logo.png?v=2" alt="Planet Producciones">
                    <h2>Iniciar Sesión</h2>
                    <p>Acceso para el equipo de Planet Producciones</p>
                </div>

                <form id="loginForm">
                    <div class="login-form-group">
                        <label for="loginCorreo">Correo</label>
                        <input type="email" id="loginCorreo" placeholder="usuario@planetproducciones.com" autocomplete="username" required>
                    </div>
                    <div class="login-form-group">
                        <label for="loginPassword">Contraseña</label>
                        <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password" required>
                    </div>

                    <div class="login-options-row">
                        <span></span>
                        <a href="#" id="loginForgotLink">¿Olvidaste tu contraseña?</a>
                    </div>

                    <button type="submit" id="btnLogin" class="submit-btn">
                        <i class="fa-solid fa-right-to-bracket"></i>
                        <span>Iniciar Sesión</span>
                    </button>

                    <div id="loginStatusMsg" class="login-status-msg">
                        <i class="fa-solid fa-circle-info"></i>
                        <span id="loginStatusText"></span>
                    </div>
                </form>

                <a href="index.html" class="login-back-link">← Volver a la página principal</a>
            </div>
        </div>
    </main>

    <script type="module" src="/src/login.ts"></script>
</body>
</html>
