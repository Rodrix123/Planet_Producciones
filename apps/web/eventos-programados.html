<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos Programados | Planet Producciones</title>

    <link rel="icon" type="image/png" href="logo.png?v=2">
    <link rel="shortcut icon" type="image/png" href="logo.png?v=2">
    <link rel="apple-touch-icon" href="logo.png?v=2">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11" defer></script>
</head>
<body class="panel-body">

    <aside class="panel-rail">
        <a href="index.html" class="rail-logo" title="Inicio">
            <img src="logo.png?v=2" alt="Planet Producciones">
        </a>
        <nav class="rail-nav">
            <a href="cotizaciones.html" class="rail-item" data-contador="cotizaciones"><i class="fa-solid fa-file-invoice-dollar"></i><span>Cotizaciones</span></a>
            <a href="eventos-proceso.html" class="rail-item" data-contador="eventosProceso"><i class="fa-solid fa-truck-ramp-box"></i><span>En proceso</span></a>
            <a href="eventos-programados.html" class="rail-item active"><i class="fa-solid fa-calendar-days"></i><span>Eventos</span></a>
            <a href="empleados.html" class="rail-item"><i class="fa-solid fa-users"></i><span>Empleados</span></a>
            <a href="inventario.html" class="rail-item"><i class="fa-solid fa-boxes-stacked"></i><span>Inventario</span></a>
        </nav>
        <a href="cambiar-password.html" class="rail-item"><i class="fa-solid fa-key"></i><span>Contraseña</span></a>
        <button type="button" id="btnLogout" class="rail-item rail-logout">
            <i class="fa-solid fa-right-from-bracket"></i><span>Salir</span>
        </button>
    </aside>

    <main class="panel-main panel-main-wide">
        <div class="page-header">
            <div>
                <h2>Eventos programados</h2>
                <p>Eventos ya definitivos, con contrato firmado.</p>
            </div>
            <a href="panel-admin.html" class="back-home-btn"><i class="fa-solid fa-arrow-left"></i> Volver al panel</a>
        </div>

        <div class="detail-section">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.25rem;">
                <button id="btnMesAnterior" class="btn btn-secondary btn-sm"><i class="fa-solid fa-chevron-left"></i></button>
                <h4 id="tituloMes" style="margin:0; color:#fff; text-transform:capitalize;"></h4>
                <button id="btnMesSiguiente" class="btn btn-secondary btn-sm"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
            <div id="calendarioGrid" class="calendar-grid"></div>
        </div>

        <div id="listaEventos" class="item-list"></div>

        <!-- Vista de detalle (datos solo de lectura; la sección de disponibilidad del personal permite solicitarla) -->
        <div id="detalleEvento" class="hidden">
            <button id="btnVolverLista" class="btn btn-secondary btn-sm" style="margin-bottom: 1.5rem;">
                <i class="fa-solid fa-arrow-left"></i> Volver a la lista
            </button>

            <div class="detail-section">
                <h4>Datos del evento</h4>
                <div id="resumenCliente"></div>
            </div>

            <div class="detail-section" id="seccionDisponibilidad">
                <div class="disp-encabezado">
                    <div>
                        <h4>Disponibilidad del personal</h4>
                        <div id="totalesDisponibilidad" class="disp-totales"></div>
                    </div>
                    <div class="disp-acciones">
                        <button type="button" id="btnActualizarDisponibilidad" class="btn btn-secondary btn-sm">
                            <i class="fa-solid fa-rotate"></i> Actualizar
                        </button>
                        <button type="button" id="btnSolicitarDisponibilidad" class="btn btn-primary btn-sm hidden">
                            <i class="fa-brands fa-whatsapp"></i> Solicitar Disponibilidad de Personal
                        </button>
                    </div>
                </div>
                <p id="notaDisponibilidad" class="disp-nota hidden"></p>
                <div id="listaConvocatorias"></div>
            </div>

            <div class="detail-section">
                <h4>Servicios cotizados</h4>
                <div id="listaItemsDetalle"></div>
                <div style="display:flex; justify-content: space-between; align-items:center; margin-top: 1.25rem;">
                    <div class="item-card-total" id="totalDetalle"></div>
                    <div style="display:flex; gap:0.75rem;">
                        <a id="linkVerPdfCotizacion" href="#" target="_blank" class="btn btn-secondary btn-sm">
                            <i class="fa-solid fa-file-pdf"></i> Ver cotización final
                        </a>
                        <a id="linkVerContratoFirmado" href="#" target="_blank" class="btn btn-secondary btn-sm">
                            <i class="fa-solid fa-file-signature"></i> Ver contrato firmado
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="modal" class="modal" aria-hidden="true">
        <div class="modal-card" role="dialog" aria-modal="true" id="modalContenido"></div>
    </div>

    <div id="toast" class="toast" role="status"></div>

    <script type="module" src="/src/eventos-programados.ts"></script>
</body>
</html>
