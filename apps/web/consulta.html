<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de consulta | Planet Producciones</title>

    <link rel="icon" type="image/png" href="logo.png?v=2">
    <link rel="shortcut icon" type="image/png" href="logo.png?v=2">
    <link rel="apple-touch-icon" href="logo.png?v=2">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11" defer></script>
    <!-- LIBRERÍA EXCEL (SheetJS), la misma versión del cotizador -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" defer></script>
</head>
<body class="panel-body">

    <aside class="panel-rail">
        <a href="index.html" class="rail-logo" title="Inicio">
            <img src="logo.png?v=2" alt="Planet Producciones">
        </a>
        <nav class="rail-nav">
            <a href="cotizaciones.html" class="rail-item" data-contador="cotizaciones"><i class="fa-solid fa-file-invoice-dollar"></i><span>Cotizaciones</span></a>
            <a href="eventos-proceso.html" class="rail-item" data-contador="eventosProceso"><i class="fa-solid fa-truck-ramp-box"></i><span>En proceso</span></a>
            <a href="eventos.html" class="rail-item"><i class="fa-solid fa-calendar-days"></i><span>Eventos</span></a>
            <a href="consulta.html" class="rail-item active" aria-current="page"><i class="fa-solid fa-magnifying-glass-chart"></i><span>Consulta</span></a>
            <a href="empleados.html" class="rail-item"><i class="fa-solid fa-users"></i><span>Empleados</span></a>
            <a href="inventario.html" class="rail-item"><i class="fa-solid fa-boxes-stacked"></i><span>Inventario</span></a>
        </nav>
        <a href="cambiar-password.html" class="rail-item"><i class="fa-solid fa-key"></i><span>Contraseña</span></a>
        <button type="button" id="btnLogout" class="rail-item rail-logout">
            <i class="fa-solid fa-right-from-bracket"></i><span>Salir</span>
        </button>
    </aside>

    <main class="panel-main panel-main-wide">
        <div class="page-header">
            <div>
                <h2>Clientes y eventos</h2>
                <p>Consulta los clientes, sus eventos agendados y el detalle de cada cotización. Desde aquí no se modifica ningún dato.</p>
            </div>
            <a href="panel-admin.html" class="back-home-btn"><i class="fa-solid fa-arrow-left"></i> Volver al panel</a>
        </div>

        <div class="filtros consulta-filtros" id="filtros" hidden>
            <label class="filtro filtro-nombre">
                <span><i class="fa-solid fa-magnifying-glass"></i> Cliente</span>
                <input type="search" id="fNombre" placeholder="Buscar por nombre" autocomplete="off">
            </label>
            <label class="filtro">
                <span><i class="fa-solid fa-flag"></i> Estado</span>
                <select id="fEstado">
                    <option value="">Todos los estados</option>
                </select>
            </label>
            <div class="filtro-grupo">
                <label class="filtro">
                    <span><i class="fa-regular fa-calendar"></i> Fecha inicio</span>
                    <input type="date" id="fDesde">
                </label>
                <label class="filtro">
                    <span><i class="fa-regular fa-calendar-minus"></i> Fecha final</span>
                    <input type="date" id="fHasta">
                </label>
            </div>
            <button type="button" id="fLimpiar" class="btn-secundario filtro-limpiar" hidden>
                <i class="fa-solid fa-filter-circle-xmark"></i> Limpiar filtros
            </button>
            <span class="filtro-conteo" id="conteo" role="status"></span>
        </div>

        <div id="estado" class="panel-estado">
            <i class="fa-solid fa-spinner fa-spin"></i> Cargando clientes...
        </div>

        <div id="listaClientes" class="consulta-lista" hidden></div>

        <!-- Vista de detalle: ocupa el lugar de la lista, como en "Eventos en proceso" -->
        <section id="detalleConsulta" class="consulta-detalle" aria-labelledby="detalleTitulo" hidden>
            <!-- Encabezado fijo: sigue visible al desplazarse, en cualquier pestaña -->
            <div class="consulta-detalle-fijo">
                <div class="consulta-detalle-barra">
                    <button type="button" id="btnVolverLista" class="btn btn-secondary btn-sm" aria-label="Volver a la lista">
                        <i class="fa-solid fa-arrow-left"></i> Volver
                    </button>
                    <span class="badge" id="detalleEstado"></span>
                    <div class="consulta-detalle-titulos">
                        <h2 id="detalleTitulo" tabindex="-1"></h2>
                        <p id="detalleSubtitulo"></p>
                    </div>
                    <div class="consulta-detalle-total">
                        <span>Total cotizado</span>
                        <strong class="item-card-total" id="detalleTotal"></strong>
                    </div>
                </div>
                <div class="tabs consulta-pestanas" role="tablist" aria-label="Secciones del detalle">
                    <button type="button" class="tab-btn active" role="tab" id="tab-resumen" data-pestana="resumen" aria-controls="panel-resumen" aria-selected="true">
                        <i class="fa-solid fa-circle-info" aria-hidden="true"></i> Resumen
                    </button>
                    <button type="button" class="tab-btn" role="tab" id="tab-servicios" data-pestana="servicios" aria-controls="panel-servicios" aria-selected="false" tabindex="-1">
                        <i class="fa-solid fa-list-ul" aria-hidden="true"></i> Servicios <span class="consulta-pestana-cuenta" data-cuenta="servicios"></span>
                    </button>
                    <button type="button" class="tab-btn" role="tab" id="tab-documentos" data-pestana="documentos" aria-controls="panel-documentos" aria-selected="false" tabindex="-1">
                        <i class="fa-solid fa-folder-open" aria-hidden="true"></i> Documentos
                    </button>
                    <button type="button" class="tab-btn" role="tab" id="tab-historial" data-pestana="historial" aria-controls="panel-historial" aria-selected="false" tabindex="-1">
                        <i class="fa-solid fa-clock-rotate-left" aria-hidden="true"></i> Historial <span class="consulta-pestana-cuenta" data-cuenta="historial"></span>
                    </button>
                </div>
            </div>
            <div id="detalleContenido"></div>
        </section>
    </main>

    <div id="toast" class="toast" role="status"></div>

    <script type="module" src="/src/consulta.ts"></script>
</body>
</html>
