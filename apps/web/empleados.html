<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empleados | Planet Producciones</title>

    <link rel="icon" type="image/png" href="logo.png?v=2">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="panel-body">

    <aside class="panel-rail">
        <a href="index.html" class="rail-logo" title="Inicio">
            <img src="logo.png?v=2" alt="Planet Producciones">
        </a>
        <nav class="rail-nav">
            <a href="cotizador.html" class="rail-item">
                <i class="fa-solid fa-file-invoice-dollar"></i><span>Cotizaciones</span>
            </a>
            <a href="eventos.html" class="rail-item">
                <i class="fa-solid fa-calendar-days"></i><span>Eventos</span>
            </a>
            <a href="empleados.html" class="rail-item active">
                <i class="fa-solid fa-users"></i><span>Empleados</span>
            </a>
        </nav>
        <a href="index.html" class="rail-item rail-logout">
            <i class="fa-solid fa-right-from-bracket"></i><span>Salir</span>
        </a>
    </aside>

    <main class="panel-main">
        <header class="panel-topbar">
            <h1>Empleados</h1>
            <div class="panel-search">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="search" id="buscador" placeholder="Buscar por nombre o correo">
            </div>
        </header>

        <div class="filtros" id="filtros" hidden>
            <div class="filtro filtro-multi" id="filtroTipoBox">
                <span><i class="fa-solid fa-user-tag"></i> Tipo</span>
                <button type="button" id="filtroTipoBtn" class="multi-btn" aria-haspopup="true" aria-expanded="false">
                    <strong id="filtroTipoTexto">Todos</strong><i class="fa-solid fa-chevron-down"></i>
                </button>
                <div id="filtroTipoMenu" class="multi-menu" hidden></div>
            </div>
            <label class="filtro">
                <span><i class="fa-solid fa-calendar-check"></i> Disponibilidad</span>
                <select id="filtroDisp">
                    <option value="">Todos</option>
                    <option value="disponibles">Disponibles</option>
                    <option value="no-disponibles">No disponibles</option>
                </select>
            </label>
            <div class="filtro-grupo" id="filtroFechaBox" hidden>
                <label class="filtro">
                    <span><i class="fa-regular fa-calendar"></i> Fecha inicio</span>
                    <input type="date" id="filtroDesde">
                </label>
                <label class="filtro">
                    <span><i class="fa-regular fa-calendar-minus"></i> Fecha final</span>
                    <input type="date" id="filtroHasta">
                </label>
            </div>
            <button type="button" id="filtroLimpiar" class="btn-secundario filtro-limpiar" hidden>
                <i class="fa-solid fa-filter-circle-xmark"></i> Limpiar filtros
            </button>
            <span id="filtroConteo" class="filtro-conteo"></span>
            <div id="filtroChips" class="chips" hidden></div>
        </div>

        <div id="estado" class="panel-estado">
            <i class="fa-solid fa-spinner fa-spin"></i> Cargando empleados...
        </div>

        <div id="roles" class="roles-grid"></div>
    </main>

    <div id="overlay" class="drawer-overlay"></div>
    <aside id="drawer" class="drawer" aria-hidden="true">
        <button id="drawerEliminar" class="drawer-delete" aria-label="Eliminar empleado" title="Eliminar empleado" hidden>
            <i class="fa-solid fa-trash-can"></i>
        </button>
        <button id="drawerCerrar" class="drawer-close" aria-label="Cerrar">
            <i class="fa-solid fa-xmark"></i>
        </button>
        <div id="drawerContenido"></div>
    </aside>

    <div id="modal" class="modal" aria-hidden="true">
        <div class="modal-card" role="dialog" aria-modal="true" id="modalContenido"></div>
    </div>

    <div id="toast" class="toast" role="status"></div>

    <script type="module" src="/src/empleados.ts"></script>
</body>
</html>
