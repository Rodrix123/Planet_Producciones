<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empleados | Planet Producciones</title>

    <link rel="icon" type="image/png" href="logo.png?v=2">
    <link rel="shortcut icon" type="image/png" href="logo.png?v=2">
    <link rel="apple-touch-icon" href="logo.png?v=2">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11" defer></script>
</head>
<body class="panel-body">

    <aside class="panel-rail">
        <a href="index.html" class="rail-logo" title="Inicio">
            <img src="logo.png?v=2" alt="Planet Producciones">
        </a>
        <nav class="rail-nav">
            <a href="cotizaciones.html" class="rail-item" data-contador="cotizaciones"><i class="fa-solid fa-file-invoice-dollar"></i><span>Cotizaciones</span></a>
            <a href="eventos-proceso.html" class="rail-item" data-contador="eventosProceso"><i class="fa-solid fa-truck-ramp-box"></i><span>En proceso</span></a>
            <a href="eventos-programados.html" class="rail-item"><i class="fa-solid fa-calendar-days"></i><span>Eventos</span></a>
            <a href="empleados.html" class="rail-item active"><i class="fa-solid fa-users"></i><span>Empleados</span></a>
            <a href="inventario.html" class="rail-item"><i class="fa-solid fa-boxes-stacked"></i><span>Inventario</span></a>
        </nav>
        <a href="cambiar-password.html" class="rail-item"><i class="fa-solid fa-key"></i><span>Contraseña</span></a>
        <button type="button" id="btnLogout" class="rail-item rail-logout">
            <i class="fa-solid fa-right-from-bracket"></i><span>Salir</span>
        </button>
    </aside>

    <main class="panel-main panel-main-wide">
        <div class="page-header">
            <div>
                <h2>Empleados</h2>
                <p>Personal de Planet Producciones y cuentas de acceso al sistema.</p>
            </div>
            <a href="panel-admin.html" class="back-home-btn"><i class="fa-solid fa-arrow-left"></i> Volver al panel</a>
        </div>

        <div class="detail-section">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.1rem;">
                <h4 style="margin:0;">Con contrato</h4>
                <button class="btn-mini" id="btnNuevoConContrato" title="Nuevo empleado con contrato"><i class="fa-solid fa-plus"></i></button>
            </div>
            <div id="listaConContrato" class="item-list"></div>
        </div>

        <div class="detail-section">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.1rem;">
                <h4 style="margin:0;">Freelance fijo</h4>
                <button class="btn-mini" id="btnNuevoFreelanceFijo" title="Nuevo freelance fijo"><i class="fa-solid fa-plus"></i></button>
            </div>
            <div id="listaFreelanceFijo" class="item-list"></div>
        </div>

        <div class="detail-section">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.1rem;">
                <h4 style="margin:0;">Freelance no fijo</h4>
                <button class="btn-mini" id="btnNuevoFreelanceNoFijo" title="Nuevo freelance no fijo"><i class="fa-solid fa-plus"></i></button>
            </div>
            <div id="listaFreelanceNoFijo" class="item-list"></div>
        </div>

        <div class="detail-section">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.1rem;">
                <h4 style="margin:0;">Cuentas de acceso</h4>
                <button class="btn-mini" id="btnNuevaCuenta" title="Nueva cuenta de acceso"><i class="fa-solid fa-plus"></i></button>
            </div>
            <div id="rolesGrid" class="roles-grid"></div>
        </div>
    </main>

    <div class="drawer-overlay" id="drawerOverlay"></div>
    <aside class="drawer" id="drawer">
        <button type="button" class="drawer-close" aria-label="Cerrar"><i class="fa-solid fa-xmark"></i></button>
        <button type="button" class="drawer-delete" id="drawerDelete" title="Eliminar cuenta" hidden><i class="fa-solid fa-trash"></i></button>
        <div id="drawerContenido"></div>
    </aside>

    <div id="modal" class="modal" aria-hidden="true">
        <div class="modal-card" role="dialog" aria-modal="true" id="modalContenido"></div>
    </div>

    <div id="toast" class="toast" role="status"></div>

    <script type="module" src="/src/empleados.ts"></script>
</body>
</html>
