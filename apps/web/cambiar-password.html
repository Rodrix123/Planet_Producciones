<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar Contraseña | Planet Producciones</title>

    <link rel="icon" type="image/png" href="logo.png?v=2">
    <link rel="shortcut icon" type="image/png" href="logo.png?v=2">
    <link rel="apple-touch-icon" href="logo.png?v=2">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="landing-body">

    <header class="promo-header">
        <div class="header-container">
            <a href="index.html" class="logo-box" style="text-decoration:none;">
                <img src="logo.png?v=2" alt="Planet Producciones Logo" class="logo-img">
                <div class="logo-text">
                    <h1>Planet Producciones</h1>
                    <p>Eventos VIP & Producción Técnica</p>
                </div>
            </a>
        </div>
    </header>

    <main>
        <section class="login-section">
            <div class="login-card">
                <div class="login-card-header">
                    <img src="logo.png?v=2" alt="Planet Producciones">
                    <h2>Cambiar Contraseña</h2>
                    <p id="cambiarPasswordSubtitulo">Por seguridad, define una nueva contraseña para tu cuenta.</p>
                </div>

                <form id="cambiarPasswordForm">
                    <div class="login-form-group">
                        <label for="passwordActual">Contraseña actual</label>
                        <input type="password" id="passwordActual" placeholder="••••••••" autocomplete="current-password" required>
                    </div>
                    <div class="login-form-group">
                        <label for="passwordNueva">Nueva contraseña</label>
                        <input type="password" id="passwordNueva" placeholder="Mínimo 8 caracteres" autocomplete="new-password" required>
                    </div>
                    <div class="login-form-group">
                        <label for="passwordNuevaConfirmar">Confirmar nueva contraseña</label>
                        <input type="password" id="passwordNuevaConfirmar" placeholder="••••••••" autocomplete="new-password" required>
                    </div>

                    <button type="submit" id="btnCambiarPassword" class="submit-btn">
                        <i class="fa-solid fa-key"></i>
                        <span>Guardar nueva contraseña</span>
                    </button>

                    <div id="cambiarPasswordStatusMsg" class="login-status-msg">
                        <i class="fa-solid fa-circle-info"></i>
                        <span id="cambiarPasswordStatusText"></span>
                    </div>
                </form>

                <a href="login.html" id="linkCerrarSesion" class="login-back-link">← Cerrar sesión</a>
            </div>
        </section>
    </main>

    <script type="module" src="/src/cambiar-password.ts"></script>
</body>
</html>
