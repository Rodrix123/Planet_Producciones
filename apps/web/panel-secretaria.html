<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Secretaria | Planet Producciones</title>

    <link rel="icon" type="image/png" href="logo.png?v=2">
    <link rel="shortcut icon" type="image/png" href="logo.png?v=2">
    <link rel="apple-touch-icon" href="logo.png?v=2">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="landing-body">

    <header class="promo-header">
        <div class="header-container">
            <a href="panel-secretaria.html" class="logo-box" style="text-decoration:none;">

                <div class="logo-text">
                    <h1>Planet Producciones</h1>
                    <p>Panel Secretaria</p>
                </div>
            </a>
            <nav class="panel-nav">
                <span id="panelUserName" class="panel-user-name"></span>
                <a href="cambiar-password.html" class="back-home-btn">
                    <i class="fa-solid fa-key"></i> Cambiar contraseña
                </a>
                <button id="btnLogout" type="button" class="back-home-btn panel-logout-btn">
                    <i class="fa-solid fa-right-from-bracket"></i> Cerrar sesión
                </button>
            </nav>
        </div>
    </header>

    <main class="panel-main">
        <div class="card-panel panel-welcome-card">
            <h2>Bienvenida, Mariana</h2>
            <p>Desde aquí generarás y enviarás los contratos de las cotizaciones ya definitivas.</p>

            <ul class="panel-feature-list">
                <a href="cotizaciones-definitivas.html" class="panel-feature-link">
                    <li><i class="fa-solid fa-file-signature"></i> Cotizaciones definitivas y generación de contrato</li>
                </a>
            </ul>

    <script type="module" src="/src/panel-secretaria.ts"></script>
