<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta name="theme-color" content="#f4f5f0">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Planet Producciones">
    <meta property="og:locale" content="es_CO">
    <meta property="og:title" content="Galería de Eventos | Planet Producciones">
    <meta property="og:description" content="Fotos reales de eventos realizados por Planet Producciones, con y sin pantalla LED.">
    <meta property="og:url" content="__SITE_URL__/galeria.html">
    <meta property="og:image" content="__SITE_URL__/og.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Primer baile de novios con chispas frías frente a una pantalla LED, montaje de Planet Producciones">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Galería de Eventos | Planet Producciones">
    <meta name="twitter:description" content="Fotos reales de eventos realizados por Planet Producciones, con y sin pantalla LED.">

    <link rel="icon" type="image/png" href="logo.png?v=2">
    <link rel="shortcut icon" type="image/png" href="logo.png?v=2">
    <link rel="apple-touch-icon" href="logo.png?v=2">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="sitio-body" data-pagina="galeria">

    <div id="sitio-header"></div>

    <main>
        <section class="pagina-cabecera">
            <div class="contenedor">
                <h1 class="titulo-pagina">Galería de Eventos</h1>
                <p class="texto-grande">
                    Una muestra real de nuestros eventos, con y sin pantalla LED.
                </p>

                <div class="galeria-filtros" role="tablist" style="margin-top: 2rem;">
                    <button type="button" class="galeria-filtro active" data-categoria="todas" role="tab" aria-selected="true">
                        Todos
                    </button>
                    <button type="button" class="galeria-filtro" data-categoria="con_pantalla" role="tab" aria-selected="false">
                        <i class="fa-solid fa-tv"></i> Eventos con pantalla
                    </button>
                    <button type="button" class="galeria-filtro" data-categoria="sin_pantalla" role="tab" aria-selected="false">
                        <i class="fa-solid fa-lightbulb"></i> Eventos sin pantalla
                    </button>
                </div>
            </div>
        </section>

        <section class="contenedor" style="padding-bottom: clamp(3.5rem, 8vw, 6rem);">
            <div id="galeriaGrid" class="galeria-mosaico"></div>
            <p id="galeriaVacio" class="galeria-vacio hidden">
                <i class="fa-solid fa-circle-info"></i> Todavía no hay fotos en esta categoría.
            </p>

            <p class="galeria-instagram">
                <a href="https://www.instagram.com/planet.producciones/" target="_blank" rel="noopener noreferrer" class="boton boton-linea"><i class="fa-brands fa-instagram"></i> Más en @planet.producciones</a>
            </p>
        </section>
    </main>

    <div id="lightbox" class="lightbox" aria-hidden="true" role="dialog" aria-label="Foto ampliada">
        <button type="button" class="lightbox-cerrar" aria-label="Cerrar"><i class="fa-solid fa-xmark"></i></button>
        <button type="button" class="lightbox-flecha lightbox-prev" aria-label="Anterior"><i class="fa-solid fa-chevron-left"></i></button>
        <img id="lightboxImg" alt="">
        <button type="button" class="lightbox-flecha lightbox-next" aria-label="Siguiente"><i class="fa-solid fa-chevron-right"></i></button>
    </div>

    <div id="sitio-footer"></div>

    <script type="module" src="/src/galeria.ts"></script>
</body>
</html>
