server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Comprime lo que es texto: el HTML, el JavaScript y el CSS se reducen a una cuarta parte o menos.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Cabeceras de seguridad básicas (se repiten en cada location que define add_header, porque nginx
    # no las hereda cuando un location agrega las suyas).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        try_files $uri $uri/ /index.html;
        # Las páginas HTML siempre se revalidan: así un despliegue nuevo se ve de inmediato.
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Lo que genera Vite lleva un código en el nombre (cambia si el contenido cambia): se puede guardar un año.
    location /assets/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Imágenes y fuentes (incluidas las fotos .webp de la galería, que son casi todo el peso del sitio).
    location ~* \.(?:png|jpe?g|gif|svg|ico|webp|avif|woff2?)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
