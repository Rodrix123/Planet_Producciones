<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos | Planet Producciones</title>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>

    <link rel="icon" type="image/png" href="logo.png?v=2">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="panel-body">

    <aside class="panel-rail">
        <a href="index.html" class="rail-logo" title="Inicio">
            <img src="logo.png?v=2" alt="Planet Producciones">
        </a>
        <nav class="rail-nav" id="railNav">
            <a href="cotizaciones.html" class="rail-item" data-contador="cotizaciones"><i class="fa-solid fa-file-invoice-dollar"></i><span>Cotizaciones</span></a>
            <a href="eventos-proceso.html" class="rail-item" data-contador="eventosProceso"><i class="fa-solid fa-truck-ramp-box"></i><span>En proceso</span></a>
            <a href="eventos.html" class="rail-item active"><i class="fa-solid fa-calendar-days"></i><span>Eventos</span></a>
            <a href="empleados.html" class="rail-item"><i class="fa-solid fa-users"></i><span>Empleados</span></a>
            <a href="inventario.html" class="rail-item"><i class="fa-solid fa-boxes-stacked"></i><span>Inventario</span></a>
        </nav>
        <a href="cambiar-password.html" class="rail-item"><i class="fa-solid fa-key"></i><span>Contraseña</span></a>
        <button type="button" id="btnLogout" class="rail-item rail-logout">
            <i class="fa-solid fa-right-from-bracket"></i><span>Salir</span>
        </button>
    </aside>

    <main class="panel-main">
        <header class="panel-topbar">
            <h1>Eventos</h1>
        </header>

        <div class="filtros eventos-filtros">
            <div class="toggles" role="group" aria-label="Filtros de estado">
                <div class="filtro-estado" role="group" aria-label="Evento confirmado">
                    <span class="filtro-estado-nombre"><i class="fa-solid fa-circle-check"></i> Evento confirmado</span>
                    <div class="segmentos">
                        <button type="button" class="segmento" data-filtro="confirmado" data-valor="todos" aria-pressed="true" title="Confirmados y sin confirmar">Todos</button>
                        <button type="button" class="segmento" data-filtro="confirmado" data-valor="si" aria-pressed="false" title="Solo los eventos confirmados">Sí</button>
                        <button type="button" class="segmento" data-filtro="confirmado" data-valor="no" aria-pressed="false" title="Solo los eventos sin confirmar">No</button>
                    </div>
                </div>
                <div class="filtro-estado" role="group" aria-label="Pago inicial hecho">
                    <span class="filtro-estado-nombre"><i class="fa-solid fa-money-bill-wave"></i> Pago inicial hecho</span>
                    <div class="segmentos">
                        <button type="button" class="segmento" data-filtro="pagoInicial" data-valor="todos" aria-pressed="true" title="Con y sin pago inicial">Todos</button>
                        <button type="button" class="segmento" data-filtro="pagoInicial" data-valor="si" aria-pressed="false" title="Solo los eventos con el pago inicial hecho">Sí</button>
                        <button type="button" class="segmento" data-filtro="pagoInicial" data-valor="no" aria-pressed="false" title="Solo los eventos sin pago inicial">No</button>
                    </div>
                </div>
                <div class="filtro-estado" role="group" aria-label="Firmado">
                    <span class="filtro-estado-nombre"><i class="fa-solid fa-file-signature"></i> Firmado</span>
                    <div class="segmentos">
                        <button type="button" class="segmento" data-filtro="firmado" data-valor="todos" aria-pressed="true" title="Firmados y sin firmar">Todos</button>
                        <button type="button" class="segmento" data-filtro="firmado" data-valor="si" aria-pressed="false" title="Solo los eventos firmados">Sí</button>
                        <button type="button" class="segmento" data-filtro="firmado" data-valor="no" aria-pressed="false" title="Solo los eventos sin firmar">No</button>
                    </div>
                </div>
            </div>
            <div class="filtro-grupo">
                <label class="filtro">
                    <span><i class="fa-regular fa-calendar"></i> Fecha inicio</span>
                    <input type="date" id="fDesde">
                </label>
                <label class="filtro">
                    <span><i class="fa-regular fa-calendar-minus"></i> Fecha final</span>
                    <input type="date" id="fHasta">
                </label>
            </div>
            <button type="button" id="fLimpiar" class="btn-secundario filtro-limpiar" hidden>
                <i class="fa-solid fa-filter-circle-xmark"></i> Limpiar filtros
            </button>
        </div>

        <div id="estado" class="panel-estado">
            <i class="fa-solid fa-spinner fa-spin"></i> Cargando eventos...
        </div>

        <section class="deck" id="deck" hidden>
            <article class="deck-panel deck-lista" id="panelLista">
                <header class="deck-head">
                    <h2 id="listaTitulo">Eventos</h2>
                    <span class="rol-count" id="listaConteo">0</span>
                </header>
                <div class="lista-eventos" id="listaEventos"></div>
            </article>

            <article class="deck-panel deck-cal" id="panelCal">
                <header class="deck-head">
                    <div class="cal-titulo">
                        <h2>Calendario</h2>
                        <p class="cal-mes" id="calTitulo"></p>
                    </div>
                    <div class="cal-nav">
                        <button type="button" class="btn-secundario cal-hoy" id="calHoy">Hoy</button>
                        <button type="button" class="cal-flecha" id="calPrev" aria-label="Mes anterior">
                            <i class="fa-solid fa-chevron-left"></i>
                        </button>
                        <button type="button" class="cal-flecha" id="calNext" aria-label="Mes siguiente">
                            <i class="fa-solid fa-chevron-right"></i>
                        </button>
                    </div>
                    <button type="button" class="cal-flecha cal-pin" id="calPin" aria-pressed="false"
                        aria-label="Fijar calendario extendido" title="Fijar calendario extendido">
                        <i class="fa-solid fa-thumbtack"></i>
                    </button>
                </header>
                <div class="cal-semana">
                    <span>Lun</span><span>Mar</span><span>Mié</span><span>Jue</span><span>Vie</span><span>Sáb</span><span>Dom</span>
                </div>
                <div class="cal-grid" id="calGrid"></div>
            </article>
        </section>

        <section class="evento-detalle" id="detalle" hidden>
            <div class="detalle-contenido" id="detalleContenido"></div>
        </section>
    </main>

    <div id="toast" class="toast" role="status"></div>

    <script type="module" src="/src/eventos.ts"></script>
</body>
</html>
