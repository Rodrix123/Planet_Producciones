<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario | Planet Producciones</title>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>

    <link rel="icon" type="image/png" href="logo.png?v=2">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="panel-body">

    <aside class="panel-rail">
        <a href="index.html" class="rail-logo" title="Inicio">
            <img src="logo.png?v=2" alt="Planet Producciones">
        </a>
        <nav class="rail-nav" id="railNav">
            <a href="cotizaciones.html" class="rail-item" data-contador="cotizaciones"><i class="fa-solid fa-file-invoice-dollar"></i><span>Cotizaciones</span></a>
            <a href="eventos-proceso.html" class="rail-item" data-contador="eventosProceso"><i class="fa-solid fa-truck-ramp-box"></i><span>En proceso</span></a>
            <a href="eventos.html" class="rail-item"><i class="fa-solid fa-calendar-days"></i><span>Eventos</span></a>
            <a href="empleados.html" class="rail-item"><i class="fa-solid fa-users"></i><span>Empleados</span></a>
            <a href="inventario.html" class="rail-item active"><i class="fa-solid fa-boxes-stacked"></i><span>Inventario</span></a>
        </nav>
        <a href="cambiar-password.html" class="rail-item"><i class="fa-solid fa-key"></i><span>Contraseña</span></a>
        <button type="button" id="btnLogout" class="rail-item rail-logout">
            <i class="fa-solid fa-right-from-bracket"></i><span>Salir</span>
        </button>
    </aside>

    <main class="panel-main">
        <a href="inventario.html" class="inv-volver"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Volver al inventario</a>

        <header class="panel-topbar inv-encabezado">
            <div class="inv-encabezado-textos">
                <h1 id="titulo">Elemento</h1>
                <p id="subtitulo" class="inv-subtitulo" hidden></p>
            </div>
            <div class="panel-search">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="search" id="buscador" placeholder="Buscar por código de barras" aria-label="Buscar por código de barras">
            </div>
        </header>

        <div id="filtros" class="filtros inv-filtros" hidden>
            <div class="filtro filtro-multi">
                <span id="etiquetaVariante"><i class="fa-solid fa-tags"></i> Variante</span>
                <button type="button" class="multi-btn" data-menu="menuVariante" aria-expanded="false" aria-controls="menuVariante" aria-labelledby="etiquetaVariante textoVariante">
                    <strong id="textoVariante">Todas</strong><i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
                </button>
                <div class="multi-menu" id="menuVariante" role="group" aria-labelledby="etiquetaVariante" hidden></div>
            </div>
            <div class="filtro filtro-multi">
                <span id="etiquetaEstado"><i class="fa-solid fa-circle-half-stroke"></i> Estado</span>
                <button type="button" class="multi-btn" data-menu="menuEstado" aria-expanded="false" aria-controls="menuEstado" aria-labelledby="etiquetaEstado textoEstado">
                    <strong id="textoEstado">Todos</strong><i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
                </button>
                <div class="multi-menu" id="menuEstado" role="group" aria-labelledby="etiquetaEstado" hidden></div>
            </div>
            <button type="button" id="limpiarFiltros" class="btn-secundario filtro-limpiar" hidden>
                <i class="fa-solid fa-filter-circle-xmark"></i> Limpiar filtros
            </button>
            <span id="resumen" class="filtro-conteo"></span>
        </div>

        <div id="estado" class="panel-estado">
            <i class="fa-solid fa-spinner fa-spin"></i> Cargando unidades...
        </div>

        <div id="tabla"></div>
    </main>

    <script type="module" src="/src/inventario-elemento.ts"></script>
</body>
</html>
