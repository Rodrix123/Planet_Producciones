services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    env_file:
      - ./apps/server/.env
    ports:
      - "5174:5174"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.vite
    ports:
      - "8080:80"
    depends_on:
      - server
    restart: unless-stopped
